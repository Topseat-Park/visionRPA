[project]
name = "visionflow-agent"
version = "0.1.0"
description = "VisionFlow Agent — screen recording & replay on Windows"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pynput>=1.7",
    "mss>=9.0",
    "pyautogui>=0.9",
    "pyperclip>=1.8",
    "psutil>=5.9",
    "pywin32>=306",
    "Pillow>=10.0",
    "visionflow-shared",
]

[project.scripts]
visionflow-agent = "agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.uv.sources]
visionflow-shared = { workspace = true }
